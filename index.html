<html lang="en"><head><meta charset="utf-8">

<title>Surgical Supply Link</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans+Condensed:wght@300;400;500&display=swap">
<style>
:root { --navy: #07394F; --petrol: #005A7C; --ocean: #087DA5; --steel: #388BAA; --ice: #59ABC5; --ink: #EAF2F4; --rule: rgba(255, 255, 255, .3); --sans: "Fira Sans Condensed", "Roboto Condensed", "Segoe UI", Arial, sans-serif; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { color: var(--ink); font: 400 18px/1.3 var(--sans); background: linear-gradient(125deg, var(--navy), var(--petrol) 22%, var(--ocean) 56%, var(--steel)); overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0; background: var(--ice); opacity: .18; clip-path: polygon(0 54%, 27% 100%, 0 100%); pointer-events: none; }
body::after { content: ""; position: fixed; inset: 0; background: #fff; opacity: .07; clip-path: polygon(45% 0, 100% 0, 100% 100%, 74% 100%); pointer-events: none; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; }
.screen { position: relative; z-index: 1; height: 100%; display: grid; grid-template-rows: 48px 1fr auto; }
.bar { background: rgba(7, 57, 79, .78); display: flex; align-items: center; padding: 0 24px; gap: 24px; }
.bar .name { font-size: 20px; } .bar .grow { flex: 1; } .bar svg { height: 30px; width: auto; display: block; }
.foot { background: rgba(7, 57, 79, .78); padding: 12px 24px; font-size: 16px; color: #cfe1e7; }
.gate { display: grid; place-content: center; gap: 18px; padding: 24px; width: min(560px, 100%); margin: 0 auto; }
h1 { font: 500 44px/1.1 var(--sans); margin: 0; } .lead { margin: 0; font-size: 20px; color: #cfe1e7; }
form { display: grid; grid-template-columns: 1fr auto; gap: 0; margin-top: 10px; border: 1px solid var(--rule); }
input { font: inherit; font-size: 20px; color: var(--navy); background: #fff; border: 0; padding: 14px 16px 12px; min-width: 0; border-radius: 0; }
input:focus { outline: 2px solid var(--ice); outline-offset: -2px; }
form button { border: 0; border-left: 1px solid var(--rule); background: rgba(255, 255, 255, .08); padding: 0 28px; font-size: 20px; min-height: 52px; }
form button:hover { background: rgba(255, 255, 255, .16); } form button:disabled { opacity: .6; cursor: default; }
.msg { min-height: 26px; margin: 0; font-size: 18px; } .msg.err { color: #ffd84a; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; height: 100%; }
.tile { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 36px; padding: 20px; border: 0; border-right: 1px solid var(--rule); background: transparent; font: 400 26px/1.25 var(--sans); text-align: center; transition: background 150ms; }
.tile:last-child { border-right: 0; } .tile:hover { background: rgba(255, 255, 255, .08); } .tile:active { background: rgba(0, 0, 0, .12); }
.tile:focus-visible { outline: 2px solid var(--ink); outline-offset: -4px; }
.tile svg { width: 110px; height: 110px; fill: none; stroke: currentColor; stroke-width: .7; stroke-linecap: round; stroke-linejoin: round; }
.tile small { display: block; font-size: 18px; color: #cfe1e7; margin-top: 6px; }
#app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; z-index: 5; background: var(--ocean); }
#vid { position: fixed; inset: 0; z-index: 10; background: #052c3d; display: grid; grid-template-rows: 48px minmax(0, 1fr) auto; } #vid video { min-height: 0; }
#vid video { width: 100%; height: 100%; object-fit: contain; background: #052c3d; display: block; }
.vbar { background: rgba(7, 57, 79, .9); display: flex; align-items: stretch; }
.vbar > * { display: flex; align-items: center; padding: 0 20px; border: 0; background: none; border-right: 1px solid var(--rule); min-height: 48px; }
.vbar .t { flex: 1; font-size: 19px; } .vbar button:hover { background: rgba(255, 255, 255, .1); } .vbar button:disabled { opacity: .45; cursor: default; }
.vcap { background: var(--navy); border-top: 1px solid var(--rule); padding: 14px 24px 12px; font: 300 26px/1.25 var(--sans); min-height: 62px; }
@media (max-width: 760px) { .tiles { grid-template-columns: 1fr; } .tile { border-right: 0; border-bottom: 1px solid var(--rule); } h1 { font-size: 34px; } }
</style></head>

</header>
  <main class="gate" id="gate">
    <h1>Surgical Supply Link</h1>
    <p class="lead">Confidential concept prototype. Enter the password you received to open it.</p>
    <form id="form" autocomplete="off">
      <input id="pw" type="password" aria-label="Password" placeholder="Password" autofocus>
      <button id="go" type="submit">Open</button>
    </form>
    <p class="msg" id="msg" role="status"></p>
  </main>
  <main class="tiles" id="menu" hidden>
    <button class="tile" id="tApp" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18v12H3zM3 8.5h18M9 20h6M12 17v3M6.5 11.5h5M6.5 14h3M14 11.5h3.5v3H14z"/></svg><span>Open the prototype<small>The working app with a simulated day</small></span></button>
    <button class="tile" id="tVid" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18v14H3zM10 9.2v5.6l5-2.8z"/></svg><span>Watch the demo video<small>Two minutes, recorded in the working app</small></span></button>
  </main>
  <footer class="foot">Concept prototype, November 2026. Synthetic data, no hospital system connected. Confidential, © 2026 Silurus Software.</footer>
</div>
<iframe id="app" title="Surgical Supply Link prototype" hidden></iframe>
<div id="vid" hidden>
  <div class="vbar"><span class="t" id="vTitle"></span><button id="vPrev" type="button">Previous</button><button id="vNext" type="button">Next</button><button id="vClose" type="button">Close</button></div>
  <video id="v" controls playsinline></video>
  <div class="vcap" id="vCap"></div>
</div>
<script>
const SALT = Uint8Array.from(atob("5PtNVd/VHcw14siaddLy6g=="), c => c.charCodeAt(0)), ITER = 600000;
const CLIPS = [{ f: "film", n: "", type: "video/mp4", cap: [[0, ""]] }];
const $ = id => document.getElementById(id);
let KEY = null, cur = 0; const urls = {};
async function deriveKey(pw) {
  const m = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: SALT, iterations: ITER, hash: "SHA-256" }, m, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
}
async function open(url) {
  const r = await fetch(url); if (!r.ok) throw new Error("load");
  const b = new Uint8Array(await r.arrayBuffer());
  return crypto.subtle.decrypt({ name: "AES-GCM", iv: b.slice(0, 12) }, KEY, b.slice(12));
}
$("form").addEventListener("submit", async e => {
  e.preventDefault(); const pw = $("pw").value.trim(); if (!pw) return;
  $("go").disabled = true; $("msg").className = "msg"; $("msg").textContent = "Checking the password";
  try { KEY = await deriveKey(pw); await open("check.bin"); $("gate").hidden = true; $("menu").hidden = false; $("tApp").focus(); }
  catch (x) { KEY = null; $("msg").className = "msg err"; $("msg").textContent = x.message === "load" ? "The page could not load its files. Check the connection and try again." : "That password does not open the prototype."; $("pw").select(); }
  $("go").disabled = false;
});
$("tApp").addEventListener("click", async () => {
  const f = $("app");
  if (!f.src) { $("tApp").disabled = true; const html = new TextDecoder().decode(await open("app.bin")); f.src = URL.createObjectURL(new Blob([html], { type: "text/html" })); $("tApp").disabled = false; }
  f.hidden = false; $("screen").hidden = true;
});
async function play(i) {
  cur = i; const c = CLIPS[i], v = $("v");
  $("vTitle").textContent = "Surgical Supply Link, demo video"; $("vCap").textContent = c.cap[0][1]; $("vCap").hidden = !c.cap[0][1]; $("vPrev").hidden = $("vNext").hidden = CLIPS.length < 2;
  $("vPrev").disabled = i === 0; $("vNext").disabled = i === CLIPS.length - 1;
  if (!urls[c.f]) urls[c.f] = URL.createObjectURL(new Blob([await open("v/" + c.f + ".bin")], { type: c.type || "video/webm" }));
  if (cur !== i) return;
  v.src = urls[c.f]; v.play().catch(() => {});
}
function showVideo() { $("vid").hidden = false; play(0); }
function hideVideo() { $("v").pause(); $("vid").hidden = true; }
$("tVid").addEventListener("click", showVideo);
$("vClose").addEventListener("click", hideVideo);
$("vPrev").addEventListener("click", () => play(cur - 1));
$("vNext").addEventListener("click", () => play(cur + 1));
$("v").addEventListener("ended", () => { if (cur < CLIPS.length - 1) play(cur + 1); });
$("v").addEventListener("timeupdate", () => { const c = CLIPS[cur].cap, t = $("v").currentTime; let s = c[0][1]; for (const x of c) if (t >= x[0]) s = x[1]; if ($("vCap").textContent !== s) $("vCap").textContent = s; });
window.addEventListener("message", e => { if (e.data === "ssl-video" && KEY) showVideo(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("vid").hidden) hideVideo(); });
</script>
